# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Public directory for image storage
    public_dir: '%kernel.project_dir%/public'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # ImageManager service - explicitly configure the public directory argument
    App\Service\ImageManager:
        arguments:
            $publicDir: '%public_dir%'

    # ImageUploadListener - register as Doctrine event listener
    App\EventListener\ImageUploadListener:
        tags:
            - { name: doctrine.event_listener, event: preRemove }
            - { name: doctrine.event_listener, event: preUpdate }

    # SecurityExceptionListener - register as kernel event listener
    App\EventListener\SecurityExceptionListener:
        arguments:
            $tokenStorage: '@security.token_storage'
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

    # ImageExtension - register as Twig extension
    App\Twig\ImageExtension:
        tags: ['twig.extension']

    # AppExtension - register as Twig extension (for additional filters)
    App\Twig\AppExtension:
        tags: ['twig.extension']

    # UserFactory - factory for creating test users
    App\Factory\UserFactory:

    # StripeService - configuration des clés depuis .env
    App\Service\StripeService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $successUrl: '%env(STRIPE_SUCCESS_URL)%'
            $cancelUrl: '%env(STRIPE_CANCEL_URL)%'
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
