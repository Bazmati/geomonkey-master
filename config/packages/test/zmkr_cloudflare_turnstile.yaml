# Environnement test : pas de navigateur ni d'appel API possibles pour
# resoudre le captcha. enabled: false fait que le validateur du bundle
# (CloudflareTurnstileCaptchaValidator) retourne immediatement sans
# verifier ni ajouter de violation. Seul l'environnement test est touche.
zmkr_cloudflare_turnstile:
    captcha:
        enabled: false
